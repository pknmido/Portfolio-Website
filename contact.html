<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="bg-animation"></div>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top glass-nav">
        <div class="container">
            <a class="navbar-brand fw-bold text-accent" href="index.html"><i class="fas fa-cloud"></i> My Portfolio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="education.html">Education</a></li>
                    <li class="nav-item"><a class="nav-link" href="skills.html">Skills</a></li>
                    <li class="nav-item"><a class="nav-link" href="experience.html">Experience</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-5 pt-5 pb-5 min-vh-100">
        <h2 class="text-center mb-5 mt-4" data-aos="fade-down">Contact Me</span>
        </h2>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="glass-card p-4 mx-2" data-aos="zoom-in" data-aos-duration="600">
                    <form id="contactForm">
                        <div class="row mb-3">
                            <div class="col-md-6" data-aos="fade-up" data-aos-delay="100">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="name" required placeholder="Enter your name">
                            </div>
                            <div class="col-md-6 mt-3 mt-md-0" data-aos="fade-up" data-aos-delay="200">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required
                                    placeholder="exemple@mail.com">
                            </div>
                        </div>
                        <div class="mb-4" data-aos="fade-up" data-aos-delay="300">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" rows="5" required
                                placeholder="Type your message here..."></textarea>
                        </div>
                        <button type="submit" id="submitBtn" class="btn btn-primary-custom w-100" data-aos="fade-up"
                            data-aos-delay="400">Transmit Message</button>
                    </form>

                    <div class="text-center mt-5 border-top border-secondary pt-4" data-aos="fade-in"
                        data-aos-delay="500">
                        <h5>Or ping me directly via:</h5>
                        <div class="d-flex justify-content-center gap-4 mt-3 fs-3">
                            <a href="https://www.linkedin.com/in/mohammed-safari-4b295926b/" title="LinkedIn" target="_blank" class="text-light hover-accent transition"><i class="fab fa-linkedin"></i></a>
                            <a href="https://github.com/pknmido" title="GitHub" target="_blank" class="text-light hover-accent transition"><i class="fab fa-github"></i></a>
                            <a href="https://www.instagram.com/pkn_mido/" title="Instagram" target="_blank" class="text-light hover-accent transition"><i class="fab fa-instagram"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-4" style="background: var(--bg-dark);">
        <p class="mb-0 text-muted">&copy; 2026 Mohammed Safari - future engineer.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/script.js"></script>
</body>

</html>
